# SPDX-License-Identifier: MIT
name: Game report
description: A game on a BC-250, working or not (it can become a community recipe; CONTRIBUTING.md "Game recipes")
title: "Game report: "
labels: ["game report"]
body:
  - type: markdown
    attributes:
      value: |
        Play the game first, then run `python3 install.py check '/path/to/Game.exe' --report` (or Setup's Check) and
        paste its output below. The report replaces your home folder, user name and library folders; read it before
        you post anyway. Never attach game files, saves or anything from your launcher accounts.
  - type: textarea
    id: report
    attributes:
      label: Check report
      description: The text from install.py check --report (it starts with "### Game report").
      render: markdown
    validations:
      required: true
  - type: dropdown
    id: generated
    attributes:
      label: Did frames generate?
      description: Report the observed frame count or ratio. "XeFG started" alone does not establish that frames were generated.
      options: ["Yes, in gameplay (give factor/ratio below)", "Only in menus", "No", "Not sure"]
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Minutes of gameplay and number of starts
      placeholder: "30 minutes, 3 starts"
    validations:
      required: true
  - type: dropdown
    id: restore
    attributes:
      label: Restore checked?
      description: Check Status, game files and launcher settings after Restore; note any differences. The backup record may remain.
      options: ["Yes", "No"]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you saw
      description: Requested factor and observed ratio, HUD, crashes or hangs, HDR, VRR, resolution, upscaler mode and changed settings.
